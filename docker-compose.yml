
services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-lab
    hostname: kafka-lab

    ports:
      - "127.0.0.1:9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-lab:19092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-lab:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_lab_data:/var/lib/kafka/data

  kafbat:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafbat-lab

    ports:
      - "127.0.0.1:8081:8080"

    depends_on:
      - kafka

    environment:
      KAFKA_CLUSTERS_0_NAME: Black-Friday-Lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-lab:19092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka_lab_data:
